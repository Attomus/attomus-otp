name: ci

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Build
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace swift:6.1 swift build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Verify package resolution (no auto-update)
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace swift:6.1 swift package resolve --disable-automatic-resolution
      - name: Test
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace swift:6.1 swift test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Lint
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace ghcr.io/realm/swiftlint:latest --strict

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Kotlin test and static analysis
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/kotlin eclipse-temurin:17-jdk ./gradlew test detekt

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Gitleaks
        run: docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source . --no-git --exit-code 1

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Generate SBOM
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace swift:6.1 sh -c \
            'swift package show-dependencies --format json > sbom.json && echo "SBOM SHA256: $(sha256sum sbom.json)"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom.json
          retention-days: 365
